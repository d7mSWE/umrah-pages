<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول - صوت المعتمر</title>
  <link rel="icon" type="image/png" href="assets/favicon-32.png" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
  />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css?v=5" />
</head>
<body>
  <div class="login-shell">
    <div class="login-brand-panel">
      <div class="brand-mark-lg"><img src="assets/logo.png" alt="شعار صوت المعتمر" /></div>
      <h2>صوت المعتمر</h2>
      <p>لوحة تحكم إدارية موحّدة لمتابعة رضا المعتمرين، إدارة البلاغات لحظيًا، واستعراض التقارير التنفيذية بدقة واحترافية.</p>
      <ul class="login-brand-features">
        <li><i class="bi bi-graph-up-arrow"></i> إحصائيات ولوحات أداء لحظية</li>
        <li><i class="bi bi-bell-fill"></i> تنبيهات فورية بالبلاغات الجديدة</li>
        <li><i class="bi bi-shield-lock-fill"></i> بيئة آمنة ومخصصة لفريق العمل</li>
      </ul>
    </div>

    <div class="login-form-panel">
      <div class="card login-card">
        <div class="text-center mb-4">
          <div class="login-icon"><i class="bi bi-person-lock"></i></div>
          <h4 class="mt-2">تسجيل الدخول</h4>
          <p class="text-muted small mb-0">مرحبًا بعودتك، يرجى إدخال بياناتك للمتابعة</p>
        </div>

        <div id="loginError" class="alert alert-danger d-none"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">اسم المستخدم</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
              <input type="text" class="form-control" id="username" required autofocus />
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">كلمة المرور</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
              <input type="password" class="form-control" id="password" required />
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="loginBtn">دخول</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/config.js?v=7"></script>
  <script src="js/api.js?v=7"></script>
  <script>
    const _isFileProtocol = window.location.protocol === "file:";
    if (_isFileProtocol) {
      const _box = document.getElementById("loginError");
      _box.textContent =
        "هذه الصفحة مفتوحة مباشرة من الملفات (file://) ولا يمكنها الاتصال بالخادم. " +
        "افتحها عبر الخادم المحلي: http://127.0.0.1:5500/login.html";
      _box.classList.remove("d-none");
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      const errorBox = document.getElementById("loginError");
      errorBox.classList.add("d-none");
      btn.disabled = true;
      btn.textContent = "جارِ الدخول...";

      if (_isFileProtocol) {
        errorBox.textContent =
          "هذه الصفحة مفتوحة مباشرة من الملفات (file://) ولا يمكنها الاتصال بالخادم. " +
          "افتحها عبر الخادم المحلي: http://127.0.0.1:5500/login.html";
        errorBox.classList.remove("d-none");
        btn.disabled = false;
        btn.textContent = "دخول";
        return;
      }

      try {
        await apiPost("/api/auth/login", {
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        });
        window.location.href = "dashboard.html";
      } catch (err) {
        errorBox.textContent = err.message || "تعذّر تسجيل الدخول";
        errorBox.classList.remove("d-none");
      } finally {
        btn.disabled = false;
        btn.textContent = "دخول";
      }
    });
  </script>
</body>
</html>
